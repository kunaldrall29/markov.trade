# Purity ban list for markov-guard ONLY. Run with:
#   cargo deny --manifest-path crates/markov-guard/Cargo.toml check bans
# The guard is a pure function: no I/O, no clock, no network, no RPC types.
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "tokio", reason = "guard must not do I/O" },
  { crate = "async-std", reason = "guard must not do I/O" },
  { crate = "reqwest", reason = "guard must not touch the network" },
  { crate = "hyper", reason = "guard must not touch the network" },
  { crate = "solana-client", reason = "guard must not depend on RPC types" },
  { crate = "solana-rpc-client", reason = "guard must not depend on RPC types" },
  { crate = "chrono", reason = "guard must not read a clock; time is passed in" },
  { crate = "time", reason = "guard must not read a clock; time is passed in" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[advisories]
version = 2
