[package]
name = "book-one"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The house agent: scheduler, sidecar stub, core, guard, submitter, redteam, paper (VENUE=devnet | shadow)."
publish = false

[lib]
name = "book_one"
path = "src/lib.rs"

[[bin]]
name = "book-one"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
anchor-lang = "1.1.2"
blake3 = "1"
demo-perps = { package = "demo_perps", path = "../../programs/demo-perps", features = [
  "no-entrypoint",
] }
markov-chain = { path = "../markov-chain" }
markov-guard = { path = "../markov-guard" }
markov-mandate = { package = "markov_mandate", path = "../../programs/markov-mandate", features = [
  "no-entrypoint",
] }
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = "4"
markov-marks = { path = "../markov-marks" }
markov-types = { path = "../markov-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
tempfile = "3"
