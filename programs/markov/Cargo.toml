[package]
name = "markov"
version = "0.1.0"
description = "Markov control-plane program: account, versioned mandates, permissions, receipts (01_Program_Build_Prompt)."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "markov"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["event-cpi", "init-if-needed"] }
solana-instructions-sysvar = "3"
anchor-spl = "1.1.2"
solana-sha256-hasher = "3"

[dev-dependencies]
litesvm = "0.16.0"
proptest = "1"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "3"
solana-system-interface = "2"
solana-sdk-ids = "3"
# TEST ONLY stand-in for venue / collect legs (never deployed).
test_noop = { path = "../test-noop", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
