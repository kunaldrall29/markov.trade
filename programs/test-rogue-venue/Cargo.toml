[package]
name = "test_rogue_venue"
version = "0.1.0"
description = "TEST ONLY. A deliberately malicious venue used to prove the mandate's vault cannot be drained by a callee. Never deployed."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "test_rogue_venue"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
markov-types = { path = "../../crates/markov-types", features = ["anchor"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
