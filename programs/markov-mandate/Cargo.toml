[package]
name = "markov_mandate"
version = "0.1.0"
description = "Markov Book mandate program: the lock. Gates, receipts, owner verbs (P02)."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "markov_mandate"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["event-cpi"] }
anchor-spl = "1.1.2"
# One BlockReason for the program and the services (docs/07 §4).
markov-types = { path = "../../crates/markov-types", features = ["anchor"] }
# ADR-003: the mark is a Pyth devnet PriceUpdateV2 account; the SDK enforces
# owner, feed id, verification level and age in one call.
pyth-solana-receiver-sdk = "2.0.0"
# Anchor 1.1.2's `solana_program` shim does not re-export a hasher; this is the
# same crate Anchor itself uses for discriminators.
solana-sha256-hasher = "3"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "3"
# The mandate CPIs into the mock venue; the tests need its ID and its .so.
demo_perps = { path = "../demo-perps", features = ["no-entrypoint"] }
# TEST ONLY: proves a venue cannot touch the vault (never deployed).
test_rogue_venue = { path = "../test-rogue-venue", features = ["no-entrypoint"] }
# Devnet evidence runner (examples/devnet_smoke.rs). Host-only; the SBF build
# never sees these. P07 folds this into crates/markov-chain.
solana-client = "4.2.2"
solana-commitment-config = "3"
solana-system-interface = "2"
anyhow = "1"
anchor-spl = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
