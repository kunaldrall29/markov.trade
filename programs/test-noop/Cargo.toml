[package]
name = "test_noop"
version = "0.1.0"
description = "TEST ONLY: a program whose one instruction does nothing. Stands in for a venue, a delegation `collect` or a swap in the control-plane program's adjacency tests. Never deployed."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "test_noop"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
