name: rust
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The two Anchor programs need the SBF build (program.yml); their LiteSVM
      # tests include_bytes! the built .so, so they are excluded here.
      - run: cargo clippy --workspace --all-targets --exclude markov_mandate --exclude demo_perps -- -D warnings
      - run: cargo build --workspace --exclude markov_mandate --exclude demo_perps
      - run: cargo test --workspace --exclude markov_mandate --exclude demo_perps
      - name: cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny cargo-audit --locked
          cargo deny check
          cargo deny --manifest-path crates/markov-guard/Cargo.toml check bans
          cargo audit
      - name: guard purity (no I/O, clock, or RPC crates in markov-guard's tree)
        run: bash scripts/guard-purity.sh
