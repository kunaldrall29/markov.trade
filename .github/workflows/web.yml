name: web
on:
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "package.json", "pnpm-workspace.yaml", "turbo.json"]
  pull_request:
    paths: ["apps/**", "packages/**", "package.json", "pnpm-workspace.yaml", "turbo.json"]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
